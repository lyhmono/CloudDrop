#:schema node_modules/wrangler/config-schema.json
name = "clouddrop"
main = "src/index.ts"
compatibility_date = "2024-12-05"

# 静态资源目录
assets = { directory = "./public" }

# Durable Objects 配置
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 生产部署前必须设置（防止自动房间码被离线穷举反推用户 /24 网段）：
#   npx wrangler secret put ROOM_SALT
